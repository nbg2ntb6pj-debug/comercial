// VISTA: AGENDA
// Calendario semanal con TODO: pedidos + visitas
// ============================================
function ViewAgenda({ ctx }) {
  const [weekOffset, setWeekOffset] = React.useState(0);
  const today = new Date();
  const startMonday = new Date(today);
  startMonday.setDate(today.getDate() - ((today.getDay() + 6) % 7) + weekOffset * 7);
  const days = [];
  for (let i = 0; i < 6; i++) { // L-Sáb
    const d = new Date(startMonday);
    d.setDate(startMonday.getDate() + i);
    days.push(d);
  }
  const visitMonth = monthKey(startMonday);
  const visitDoneSet = ctx.visitas[visitMonth] || {};

  return (
    <div className="space-y-4">
      <div className="bg-white border border-stone-200 rounded-lg p-4">
        <div className="flex items-center justify-between mb-3">
          <h2 className="display text-3xl">Agenda</h2>
          <div className="flex items-center gap-2">
            <button onClick={() => setWeekOffset(weekOffset - 1)} className="btn btn-secondary text-xs">← Semana</button>
            <button onClick={() => setWeekOffset(0)} className="btn btn-secondary text-xs">Hoy</button>
            <button onClick={() => setWeekOffset(weekOffset + 1)} className="btn btn-secondary text-xs">Semana →</button>
          </div>
        </div>
        <div className="text-sm text-stone-500">
          Semana del {formatDateShort(days[0])} al {formatDateShort(days[5])}
        </div>
      </div>

      <div className="space-y-3">
        {days.map(d => <AgendaDay key={ymd(d)} date={d} ctx={ctx} visitDoneSet={visitDoneSet} />)}
      </div>
    </div>
  );
}

function AgendaDay({ date, ctx, visitDoneSet }) {
  const dow = date.getDay();
  const dk = DOW_TO_KEY[dow] || null;
  const isToday = ymd(date) === todayYMD();

  // Pedidos del día (clientes con dia_pedido = dk)
  const pedidosClientes = dk ? ctx.clientes.filter(c => c.dias_pedido && c.dias_pedido.includes(dk)) : [];

  // Visitas del día: clientes con dia_visita = dk, según semana del mes
  const visitWeek = currentVisitWeek(date);
  let visitasClientes = [];
  if (visitWeek === 1 && dk && DIAS_VISITA.includes(dk)) {
    // S1 = todos (excepto TELEFONICA)
    visitasClientes = ctx.clientes.filter(c => c.dia_visita === dk && c.frecuencia !== "TELEFONICA");
  } else if (visitWeek === 3 && dk && DIAS_VISITA.includes(dk)) {
    // S3 = solo QUINCENAL
    visitasClientes = ctx.clientes.filter(c => c.dia_visita === dk && c.frecuencia === "QUINCENAL");
  }

  const dayLabel = date.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "short" });

  return (
    <div className={"bg-white border rounded-lg overflow-hidden " + (isToday ? "border-red-700 ring-1 ring-red-700" : "border-stone-200")}>
      <div className="px-4 py-2 bg-stone-50 border-b border-stone-200 flex items-center justify-between">
        <div className="font-bold text-sm uppercase tracking-wider">
          {isToday && <span className="chip chip-fac mr-2">HOY</span>}
          {dayLabel}
        </div>
        <div className="text-xs text-stone-500 flex gap-3">
          {pedidosClientes.length > 0 && <span><I name="package" size={11} className="inline mr-1" />{pedidosClientes.length}</span>}
          {visitasClientes.length > 0 && <span className="text-amber-700"><I name="check" size={11} className="inline mr-1" />{visitasClientes.length}</span>}
        </div>
      </div>

      {pedidosClientes.length === 0 && visitasClientes.length === 0 ? (
        <div className="px-4 py-3 text-xs text-stone-400 italic">
          {dow === 5 ? "Viernes — día libre" : dow === 0 ? "Domingo — día libre" : "Nada programado"}
        </div>
      ) : (
        <div className="divide-y divide-stone-100">
          {pedidosClientes.length > 0 && (
            <div className="px-4 py-2">
              <div className="text-[10px] uppercase tracking-widest text-stone-400 font-bold mb-1 flex items-center gap-1">
                <I name="package" size={10} /> Pedidos ({pedidosClientes.length})
                <span className="ml-auto text-stone-500 font-normal normal-case">entrega {formatDateShort(deliveryFromOrderDate(date))}</span>
              </div>
              <div className="text-xs text-stone-600 space-y-0.5">
                {Object.entries(groupBy(pedidosClientes, "poblacion")).map(([pob, cls]) => (
                  <div key={pob}>
                    <span className="font-bold">{pob}</span>: <span className="text-stone-500">{cls.length}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
          {visitasClientes.length > 0 && (
            <div className="px-4 py-2 bg-amber-50">
              <div className="text-[10px] uppercase tracking-widest text-amber-700 font-bold mb-1 flex items-center gap-1">
                <I name="check" size={10} /> Visitas {visitWeek === 1 ? "S1 (TODOS)" : "S3 (QUINCENALES)"} ({visitasClientes.length})
              </div>
              <div className="text-xs text-stone-700 space-y-0.5">
                {Object.entries(groupBy(visitasClientes, "poblacion")).map(([pob, cls]) => {
                  const hechas = cls.filter(c => visitDoneSet[c.id]).length;
                  return (
                    <div key={pob}>
                      <span className="font-bold">{pob}</span>: <span className="text-stone-500">{hechas}/{cls.length}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function groupBy(arr, key) {
  const r = {};
  arr.forEach(x => { if (!r[x[key]]) r[x[key]] = []; r[x[key]].push(x); });
  return r;
}

// ============================================
// VISTA: VISITAS
// Por mes, con S1 (todos) y S3 (solo quincenales)
// ============================================
function ViewVisitas({ ctx }) {
  const [monthOff, setMonthOff] = React.useState(0);
  const [week, setWeek] = React.useState(1); // 1 o 3
  const [showPrint, setShowPrint] = React.useState(false);
  const baseDate = new Date();
  baseDate.setMonth(baseDate.getMonth() + monthOff);
  const mk = monthKey(baseDate);
  const visitDoneSet = ctx.visitas[mk] || {};
  const skipSet = ctx.visitSkip?.[mk] || {};

  const mes = baseDate.toLocaleDateString("es-ES", { month: "long", year: "numeric" });
  const { monday, thursday } = getWeekBlock(baseDate.getFullYear(), baseDate.getMonth(), week);

  // Clientes para esta semana — siempre excluyendo TELEFONICA y SIN_VISITA
  const clientes = (week === 1
    ? ctx.clientes.filter(c => c.frecuencia !== "TELEFONICA" && c.frecuencia !== "SIN_VISITA")
    : ctx.clientes.filter(c => c.frecuencia === "QUINCENAL")
  ).filter(c => !skipSet[c.id]); // Excluir los saltados este mes

  // Lista de saltados (para mostrar al final)
  const saltados = (week === 1
    ? ctx.clientes.filter(c => c.frecuencia !== "TELEFONICA" && c.frecuencia !== "SIN_VISITA")
    : ctx.clientes.filter(c => c.frecuencia === "QUINCENAL")
  ).filter(c => skipSet[c.id]);

  // Agrupar por día de visita
  const porDia = { L: [], M: [], MI: [], J: [] };
  clientes.forEach(c => { if (porDia[c.dia_visita]) porDia[c.dia_visita].push(c); });

  const total = clientes.length;
  const hechas = clientes.filter(c => visitDoneSet[c.id]).length;
  const pendientes = total - hechas;

  const toggleVisita = (cliente) => {
    const m = { ...visitDoneSet };
    if (m[cliente.id]) delete m[cliente.id];
    else m[cliente.id] = new Date().toISOString();
    ctx.setVisitas({ ...ctx.visitas, [mk]: m });
  };

  const toggleSkip = (cliente) => {
    const s = { ...skipSet };
    if (s[cliente.id]) delete s[cliente.id];
    else s[cliente.id] = new Date().toISOString();
    ctx.setVisitSkip({ ...(ctx.visitSkip || {}), [mk]: s });
  };

  return (
    <div className="space-y-4">
      <div className="bg-white border border-stone-200 rounded-lg p-4">
        <div className="flex items-center justify-between mb-3">
          <h2 className="display text-3xl">Visitas</h2>
          <div className="flex items-center gap-2">
            <button onClick={() => setShowPrint(true)} className="btn btn-secondary text-xs">🖨️</button>
            <button onClick={() => setMonthOff(monthOff - 1)} className="btn btn-secondary text-xs">←</button>
            <span className="text-sm font-bold uppercase">{mes}</span>
            <button onClick={() => setMonthOff(monthOff + 1)} className="btn btn-secondary text-xs">→</button>
          </div>
        </div>

        <div className="flex gap-1 bg-stone-100 p-1 rounded mb-3">
          <button onClick={() => setWeek(1)} className={"flex-1 py-2 text-xs font-bold rounded " + (week === 1 ? "bg-white shadow-sm" : "text-stone-500")}>
            S1 · TODOS los clientes
          </button>
          <button onClick={() => setWeek(3)} className={"flex-1 py-2 text-xs font-bold rounded " + (week === 3 ? "bg-white shadow-sm" : "text-stone-500")}>
            S3 · Solo QUINCENALES
          </button>
        </div>

        <div className="text-xs text-stone-500 mb-2">
          {week === 1 ? "Primer" : "Tercer"} lunes-jueves: del <strong>{formatDateShort(monday)}</strong> al <strong>{formatDateShort(thursday)}</strong>
        </div>

        <div className="flex gap-4 text-sm">
          <div><span className="text-stone-500">Pendientes</span> <span className="font-bold text-red-700">{pendientes}</span></div>
          <div><span className="text-stone-500">Hechas</span> <span className="font-bold text-green-700">{hechas}</span></div>
          <div className="ml-auto"><span className="text-stone-500">Total</span> <span className="font-bold">{total}</span></div>
        </div>
        {total > 0 && (
          <div className="mt-2 bg-stone-100 h-2 rounded overflow-hidden">
            <div className="h-full bg-green-600 transition-all" style={{ width: `${(hechas / total) * 100}%` }}></div>
          </div>
        )}
      </div>

      {DIAS_VISITA.map(dk => {
        const cls = porDia[dk];
        if (cls.length === 0) return null;
        const dayDate = new Date(monday);
        dayDate.setDate(monday.getDate() + DIAS_VISITA.indexOf(dk));
        // Agrupar por población
        const porPob = groupBy(cls, "poblacion");
        return (
          <div key={dk} className="bg-white border border-stone-200 rounded-lg overflow-hidden">
            <div className="px-4 py-3 bg-stone-50 border-b border-stone-200 flex items-center justify-between">
              <div>
                <div className="font-bold text-sm uppercase tracking-wider">{DIAS_FULL_LABEL[dk]} · {formatDateShort(dayDate)}</div>
                <div className="text-xs text-stone-500">{cls.length} clientes · {Object.keys(porPob).length} poblaciones</div>
              </div>
              <div className="text-sm font-bold">{cls.filter(c => visitDoneSet[c.id]).length}/{cls.length}</div>
            </div>
            <div>
              {Object.keys(porPob).sort().map(pob => (
                <div key={pob}>
                  <div className="px-4 py-1.5 bg-stone-50/50 border-b border-stone-100 text-xs font-bold text-stone-600">{pob}</div>
                  <div className="divide-y divide-stone-100">
                    {porPob[pob].map(c => {
                      const done = !!visitDoneSet[c.id];
                      return (
                        <div key={c.id} className="px-4 py-2 flex items-center gap-3 hover:bg-stone-50">
                          <button onClick={() => toggleVisita(c)}
                            className={"w-6 h-6 rounded border-2 flex items-center justify-center shrink-0 " +
                              (done ? "bg-green-600 border-green-600 text-white" : "border-stone-300 hover:border-stone-500")}>
                            {done && <I name="check" size={14} />}
                          </button>
                          <button onClick={() => ctx.openEdit(c)} className="flex-1 min-w-0 text-left">
                            <div className={"text-sm " + (done ? "line-through text-stone-400" : "font-medium")}>
                              {c.nombre} <FreqChip f={c.frecuencia} size="small" />
                            </div>
                            <div className="text-xs text-stone-500 flex items-center gap-2">
                              {c.cod_faccsa && <span className="chip chip-fac">F·{c.cod_faccsa}</span>}
                              {c.cod_prolongo && <span className="chip chip-pro">P·{c.cod_prolongo}</span>}
                              {c.telefono && <span className="mono">{c.telefono}</span>}
                            </div>
                          </button>
                          {c.telefono && (
                            <button onClick={() => tryCall(c.telefono)} className="btn btn-secondary text-xs flex items-center gap-1" title="Llamar">
                              <I name="phone" size={11} />
                            </button>
                          )}
                          <button onClick={() => toggleSkip(c)} className="btn btn-ghost text-xs text-stone-400 hover:text-stone-700" title="Saltar este mes">
                            ⊘
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      })}

      {saltados.length > 0 && (
        <div className="bg-white border border-stone-200 rounded-lg overflow-hidden">
          <div className="px-4 py-2 bg-stone-100 border-b border-stone-200">
            <div className="font-bold text-xs uppercase tracking-wider text-stone-600">Saltados este mes ({saltados.length})</div>
            <div className="text-[10px] text-stone-500">Vuelven a aparecer el mes que viene</div>
          </div>
          <div className="divide-y divide-stone-100">
            {saltados.map(c => (
              <div key={c.id} className="px-4 py-2 flex items-center gap-3 hover:bg-stone-50">
                <button onClick={() => ctx.openEdit(c)} className="flex-1 min-w-0 text-left">
                  <div className="text-sm text-stone-500 line-through">{c.nombre} <FreqChip f={c.frecuencia} size="small" /></div>
                  <div className="text-xs text-stone-400">{c.poblacion}</div>
                </button>
                <button onClick={() => toggleSkip(c)} className="btn btn-secondary text-xs">Restaurar</button>
              </div>
            ))}
          </div>
        </div>
      )}

      <PrintModal open={showPrint} onClose={() => setShowPrint(false)} titulo="Listado de visitas" tipo="visitas" ctx={ctx} />
    </div>
  );
}

// ============================================
// VISTA: CLIENTES
// ============================================
function ViewClientes({ ctx }) {
  const [q, setQ] = React.useState("");
  const [filterFreq, setFilterFreq] = React.useState("");
  const [filterPob, setFilterPob] = React.useState("");
  const [showPrint, setShowPrint] = React.useState(false);

  const filtered = ctx.clientes.filter(c => {
    if (filterFreq && c.frecuencia !== filterFreq) return false;
    if (filterPob && c.poblacion !== filterPob) return false;
    if (q.trim()) {
      const Q = q.toUpperCase();
      if (!c.nombre.toUpperCase().includes(Q) && !c.poblacion.toUpperCase().includes(Q) &&
        !(c.cod_faccsa && c.cod_faccsa.includes(Q)) && !(c.cod_prolongo && c.cod_prolongo.includes(Q))) return false;
    }
    return true;
  });

  const poblaciones = [...new Set(ctx.clientes.map(c => c.poblacion))].sort();
  const porPob = groupBy(filtered, "poblacion");

  return (
    <div className="space-y-4">
      <div className="bg-white border border-stone-200 rounded-lg p-4">
        <div className="flex items-baseline justify-between mb-3">
          <h2 className="display text-3xl">Clientes</h2>
          <div className="flex items-center gap-2">
            <button onClick={() => setShowPrint(true)} className="btn btn-secondary text-xs">🖨️ Imprimir</button>
            <div className="text-sm text-stone-500">{filtered.length} de {ctx.clientes.length}</div>
          </div>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-3">
          <div className="relative sm:col-span-3">
            <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" />
            <input className="input pl-9" placeholder="Buscar nombre, población o código..." value={q} onChange={e => setQ(e.target.value)} />
          </div>
          <select className="input" value={filterFreq} onChange={e => setFilterFreq(e.target.value)}>
            <option value="">Todas frecuencias</option>
            <option value="MENSUAL">Mensual</option>
            <option value="QUINCENAL">Quincenal</option>
            <option value="SIN_VISITA">Sin visita</option>
            <option value="TELEFONICA">Telefónica</option>
          </select>
          <select className="input sm:col-span-2" value={filterPob} onChange={e => setFilterPob(e.target.value)}>
            <option value="">Todas poblaciones</option>
            {poblaciones.map(p => <option key={p} value={p}>{p}</option>)}
          </select>
        </div>
        <div className="flex flex-wrap gap-3 text-xs">
          <div><FreqChip f="QUINCENAL" size="small" /> {ctx.clientes.filter(c => c.frecuencia === "QUINCENAL").length}</div>
          <div><FreqChip f="MENSUAL" size="small" /> {ctx.clientes.filter(c => c.frecuencia === "MENSUAL").length}</div>
          <div><FreqChip f="SIN_VISITA" size="small" /> {ctx.clientes.filter(c => c.frecuencia === "SIN_VISITA").length}</div>
          <div><FreqChip f="TELEFONICA" size="small" /> {ctx.clientes.filter(c => c.frecuencia === "TELEFONICA").length}</div>
        </div>
      </div>

      {Object.keys(porPob).sort().map(pob => (
        <div key={pob} className="bg-white border border-stone-200 rounded-lg overflow-hidden">
          <div className="px-4 py-2 bg-stone-50 border-b border-stone-200 flex items-baseline justify-between">
            <div className="font-bold text-xs uppercase tracking-wider">{pob}</div>
            <div className="text-xs text-stone-500">{porPob[pob].length}</div>
          </div>
          <div className="divide-y divide-stone-100">
            {porPob[pob].map(c => <ClienteRow key={c.id} c={c} ctx={ctx} />)}
          </div>
        </div>
      ))}

      <PrintModal open={showPrint} onClose={() => setShowPrint(false)} titulo="Listado de clientes" tipo="clientes" ctx={ctx} />
    </div>
  );
}

// ============================================
// MODAL: editar cliente
// ============================================
function ClienteEditModal({ cliente, ctx, onClose }) {
  const [form, setForm] = React.useState({
    telefono: cliente.telefono || "",
    email: cliente.email || "",
    direccion: cliente.direccion || "",
    cod_prolongo: cliente.cod_prolongo || "",
    cod_faccsa: cliente.cod_faccsa || "",
    frecuencia: cliente.frecuencia || "MENSUAL",
    dias_pedido: cliente.dias_pedido || [],
    tarifa_faccsa: cliente.tarifa_faccsa || "90",
    tarifa_prolongo: cliente.tarifa_prolongo || "detall",
    notas: ctx.notas[cliente.id] || "",
  });
  const dia_visita = cliente.dia_visita;
  const dias_reparto = cliente.dias_reparto;

  // Estados desplegables
  const [showTarifaFaccsa, setShowTarifaFaccsa] = React.useState(false);
  const [showTarifaProlongo, setShowTarifaProlongo] = React.useState(false);
  const [busquedaTarifa, setBusquedaTarifa] = React.useState("");

  // Promociones activas para este cliente
  const promos = React.useMemo(() => promosCliente(cliente, ctx.promociones, ctx.productos), [cliente, ctx.promociones, ctx.productos]);

  // Productos FACCSA según tarifa del cliente
  const productosTarifaFaccsa = React.useMemo(() => {
    const all = ctx.productos.filter(p => p.marca === 'FACCSA' && (p.precio_90 != null || p.precio_91 != null));
    if (!busquedaTarifa.trim()) return all;
    const Q = busquedaTarifa.toUpperCase();
    return all.filter(p => p.descripcion.toUpperCase().includes(Q) || p.codigo.includes(Q));
  }, [ctx.productos, busquedaTarifa]);

  // Productos PROLONGO según tarifa del cliente
  const productosTarifaProlongo = React.useMemo(() => {
    const all = ctx.productos.filter(p => p.marca === 'PROLONGO' && p.precio_detall != null);
    if (!busquedaTarifa.trim()) return all;
    const Q = busquedaTarifa.toUpperCase();
    return all.filter(p => p.descripcion.toUpperCase().includes(Q) || p.codigo.includes(Q));
  }, [ctx.productos, busquedaTarifa]);

  const toggleDia = (d) => {
    const dp = form.dias_pedido.includes(d) ? form.dias_pedido.filter(x => x !== d) : [...form.dias_pedido, d];
    setForm({ ...form, dias_pedido: dp });
  };

  const save = () => {
    const visitas_mes = form.frecuencia === "QUINCENAL" ? 2 : (form.frecuencia === "TELEFONICA" || form.frecuencia === "SIN_VISITA") ? 0 : 1;
    ctx.setCust({ ...ctx.cust, [cliente.id]: { ...form, visitas_mes } });
    ctx.setNotas({ ...ctx.notas, [cliente.id]: form.notas });
    onClose();
  };
  const reset = () => {
    if (!confirm("¿Quitar todos los cambios manuales de este cliente?")) return;
    const cp = { ...ctx.cust }; delete cp[cliente.id];
    ctx.setCust(cp);
    const cn = { ...ctx.notas }; delete cn[cliente.id];
    ctx.setNotas(cn);
    onClose();
  };

  return (
    <div className="fixed inset-0 bg-stone-900/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div className="bg-white w-full sm:max-w-lg sm:rounded-lg max-h-[90vh] overflow-y-auto">
        <div className="px-4 py-3 border-b border-stone-200 flex items-start justify-between sticky top-0 bg-white">
          <div className="min-w-0">
            <h3 className="font-bold text-lg truncate">{cliente.nombre}</h3>
            <div className="text-xs text-stone-500">{cliente.poblacion}</div>
          </div>
          <button onClick={onClose} className="text-stone-500 hover:text-stone-900 shrink-0 ml-3"><I name="x" size={20} /></button>
        </div>
        <div className="p-4 space-y-3">
          <div>
            <label className="text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1 block">Teléfono</label>
            <div className="flex gap-2">
              <input className="input flex-1" value={form.telefono} onChange={e => setForm({ ...form, telefono: e.target.value })} />
              {form.telefono && (
                <>
                  <button onClick={() => tryCall(form.telefono)} className="btn btn-secondary text-xs flex items-center gap-1" title="Llamar"><I name="phone" size={12} /></button>
                  <a href={`https://wa.me/${(()=>{let t=form.telefono.replace(/\D/g,'');if(t.startsWith('34'))return t;if(t.startsWith('0034'))return t.slice(2);if(t.length===9)return '34'+t;return t;})()}`} target="_blank" rel="noopener noreferrer" className="btn text-xs flex items-center gap-1" style={{background:'#25D366', color:'white'}} title="WhatsApp">💬</a>
                </>
              )}
            </div>
          </div>
          <div>
            <label className="text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1 block">Email</label>
            <input className="input" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} />
          </div>
          <div>
            <label className="text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1 block">Dirección</label>
            <input className="input" value={form.direccion} onChange={e => setForm({ ...form, direccion: e.target.value })} />
          </div>
          <div className="grid grid-cols-2 gap-2">
            <div>
              <label className="text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1 block">Cod FACCSA</label>
              <input className="input" value={form.cod_faccsa} onChange={e => setForm({ ...form, cod_faccsa: e.target.value })} />
            </div>
            <div>
              <label className="text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1 block">Cod Prolongo</label>
              <input className="input" value={form.cod_prolongo} onChange={e => setForm({ ...form, cod_prolongo: e.target.value })} />
            </div>
          </div>
          <div>
            <label className="text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1 block">Frecuencia visita</label>
            <select className="input" value={form.frecuencia} onChange={e => setForm({ ...form, frecuencia: e.target.value })}>
              <option value="MENSUAL">MENSUAL (1 visita/mes - solo S1)</option>
              <option value="QUINCENAL">QUINCENAL (2 visitas/mes - S1 y S3)</option>
              <option value="SIN_VISITA">SIN VISITA (paga transfer., pide WhatsApp)</option>
              <option value="TELEFONICA">TELEFÓNICA (no se visita)</option>
            </select>
          </div>
          <div>
            <label className="text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1 block">Días pedido</label>
            <div className="flex flex-wrap gap-1">
              {DIAS_PEDIDO.map(d => (
                <button key={d} onClick={() => toggleDia(d)}
                  className={"px-3 py-1.5 text-xs font-bold rounded border " + (form.dias_pedido.includes(d) ? "bg-red-700 text-white border-red-700" : "bg-white text-stone-600 border-stone-300")}>
                  {DIAS_LABEL[d]}
                </button>
              ))}
            </div>
          </div>
          <div className="bg-stone-50 rounded p-3 text-xs space-y-1">
            <div className="flex justify-between"><span className="text-stone-500">Día visita (auto):</span> <span className="font-bold">{DIAS_FULL_LABEL[dia_visita] || "—"}</span></div>
            <div className="flex justify-between"><span className="text-stone-500">Días reparto (info):</span> <span className="font-bold">{dias_reparto || "—"}</span></div>
          </div>

          {form.cod_faccsa && (
            <div>
              <label className="text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1 block">Tarifa FACCSA</label>
              <div className="flex gap-1 bg-stone-100 p-1 rounded mb-2">
                <button onClick={() => setForm({...form, tarifa_faccsa: "90"})} className={"flex-1 py-1.5 text-xs font-bold rounded " + (form.tarifa_faccsa === "90" ? "bg-white shadow-sm" : "text-stone-500")}>Tarifa 90</button>
                <button onClick={() => setForm({...form, tarifa_faccsa: "91"})} className={"flex-1 py-1.5 text-xs font-bold rounded " + (form.tarifa_faccsa === "91" ? "bg-white shadow-sm" : "text-stone-500")}>Tarifa 91</button>
              </div>
              <button onClick={() => setShowTarifaFaccsa(!showTarifaFaccsa)} className="btn btn-secondary text-xs w-full flex items-center justify-between">
                <span>👁️ Ver tarifa FACCSA {form.tarifa_faccsa} ({productosTarifaFaccsa.length} productos)</span>
                <span>{showTarifaFaccsa ? "▲" : "▼"}</span>
              </button>
              {showTarifaFaccsa && (
                <div className="mt-2 border border-stone-200 rounded overflow-hidden">
                  <div className="p-2 bg-stone-50 border-b border-stone-200">
                    <div className="relative">
                      <Search size={12} className="absolute left-2 top-1/2 -translate-y-1/2 text-stone-400" />
                      <input className="input pl-7 text-xs" placeholder="Buscar producto..." value={busquedaTarifa} onChange={e => setBusquedaTarifa(e.target.value)} />
                    </div>
                  </div>
                  <div className="max-h-64 overflow-y-auto divide-y divide-stone-100">
                    {productosTarifaFaccsa.map(p => {
                      const precio = form.tarifa_faccsa === "91" ? p.precio_91 : p.precio_90;
                      // Comprobar si hay promo para este cliente y producto
                      const promo = promos.find(pr => pr.producto_cod === p.codigo);
                      return (
                        <div key={p.codigo} className="px-3 py-1.5 flex items-center justify-between gap-2 text-xs hover:bg-stone-50">
                          <div className="min-w-0 flex-1">
                            <div className="font-medium truncate">{p.descripcion}</div>
                            <div className="text-stone-500 mono">{p.codigo}</div>
                          </div>
                          <div className="text-right shrink-0">
                            {promo ? (
                              <>
                                <div className="font-bold mono text-red-700">€{promo.precio.toFixed(2)}</div>
                                <div className="text-[10px] text-stone-400 line-through">€{precio != null ? precio.toFixed(2) : "—"}</div>
                              </>
                            ) : (
                              <div className="font-bold mono">€{precio != null ? precio.toFixed(2) : "—"}</div>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          )}

          {form.cod_prolongo && (
            <div>
              <label className="text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1 block">Tarifa Prolongo</label>
              <div className="flex gap-1 bg-stone-100 p-1 rounded mb-2">
                <button onClick={() => setForm({...form, tarifa_prolongo: "detall"})} className={"flex-1 py-1.5 text-xs font-bold rounded " + (form.tarifa_prolongo === "detall" ? "bg-white shadow-sm" : "text-stone-500")}>DETALL</button>
                <button onClick={() => setForm({...form, tarifa_prolongo: "gms"})} className={"flex-1 py-1.5 text-xs font-bold rounded " + (form.tarifa_prolongo === "gms" ? "bg-white shadow-sm" : "text-stone-500")}>GMS</button>
                <button onClick={() => setForm({...form, tarifa_prolongo: "dist"})} className={"flex-1 py-1.5 text-xs font-bold rounded " + (form.tarifa_prolongo === "dist" ? "bg-white shadow-sm" : "text-stone-500")}>DIST</button>
              </div>
              <button onClick={() => setShowTarifaProlongo(!showTarifaProlongo)} className="btn btn-secondary text-xs w-full flex items-center justify-between">
                <span>👁️ Ver tarifa Prolongo {form.tarifa_prolongo.toUpperCase()} ({productosTarifaProlongo.length} productos)</span>
                <span>{showTarifaProlongo ? "▲" : "▼"}</span>
              </button>
              {showTarifaProlongo && (
                <div className="mt-2 border border-stone-200 rounded overflow-hidden">
                  <div className="p-2 bg-stone-50 border-b border-stone-200">
                    <div className="relative">
                      <Search size={12} className="absolute left-2 top-1/2 -translate-y-1/2 text-stone-400" />
                      <input className="input pl-7 text-xs" placeholder="Buscar producto..." value={busquedaTarifa} onChange={e => setBusquedaTarifa(e.target.value)} />
                    </div>
                  </div>
                  <div className="max-h-64 overflow-y-auto divide-y divide-stone-100">
                    {productosTarifaProlongo.map(p => {
                      const t = form.tarifa_prolongo;
                      const precio = t === "gms" ? p.precio_gms : t === "dist" ? p.precio_dist : p.precio_detall;
                      return (
                        <div key={p.codigo} className="px-3 py-1.5 flex items-center justify-between gap-2 text-xs hover:bg-stone-50">
                          <div className="min-w-0 flex-1">
                            <div className="font-medium truncate">{p.descripcion}</div>
                            <div className="text-stone-500 mono">{p.codigo}{p.formato ? ` · ${p.formato}` : ""}</div>
                          </div>
                          <div className="font-bold mono shrink-0">€{precio != null ? precio.toFixed(2) : "—"}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          )}

          {promos.length > 0 && (
            <div className="bg-red-50 border border-red-200 rounded p-3">
              <div className="font-bold text-xs uppercase tracking-wider text-red-700 mb-2 flex items-center justify-between">
                <span>⚡ Promociones esta semana</span>
                <span className="text-red-700 font-bold">{promos.length}</span>
              </div>
              <div className="space-y-1">
                {promos.map((p, i) => (
                  <div key={i} className="flex justify-between items-center text-xs gap-2">
                    <div className="min-w-0 flex-1">
                      <div className="font-medium truncate">{p.descripcion}</div>
                      <div className="text-stone-500 mono">{p.producto_cod}</div>
                    </div>
                    <div className="font-bold mono text-red-700 shrink-0">€{p.precio.toFixed(2)}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div>
            <label className="text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1 block">Notas</label>
            <textarea className="input" rows="3" value={form.notas} onChange={e => setForm({ ...form, notas: e.target.value })} />
          </div>
        </div>
        <div className="px-4 py-3 border-t border-stone-200 flex items-center justify-between sticky bottom-0 bg-white">
          <button onClick={reset} className="btn btn-ghost text-xs text-stone-500">Reset</button>
          <div className="flex gap-2">
            <button onClick={onClose} className="btn btn-secondary text-sm">Cancelar</button>
            <button onClick={save} className="btn btn-primary text-sm">Guardar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ============================================
// VISTA: CATÁLOGO
// Consulta rápida de productos sin abrir pedido
// ============================================
function ViewCatalogo({ ctx }) {
  const [q, setQ] = React.useState("");
  const [marca, setMarca] = React.useState("TODOS"); // TODOS | FACCSA | PROLONGO
  const [cat, setCat] = React.useState(""); // categoría

  const productos = React.useMemo(() => {
    return ctx.productos.filter(p => {
      if (marca !== "TODOS" && p.marca !== marca) return false;
      if (cat && p.categoria !== cat) return false;
      if (q.trim()) {
        const Q = q.toUpperCase();
        return p.descripcion.toUpperCase().includes(Q) ||
               p.codigo.includes(Q) ||
               (p.categoria || "").toUpperCase().includes(Q);
      }
      return true;
    });
  }, [ctx.productos, marca, cat, q]);

  // Categorías disponibles según marca
  const categorias = React.useMemo(() => {
    const set = new Set();
    ctx.productos.forEach(p => {
      if (marca === "TODOS" || p.marca === marca) {
        if (p.categoria) set.add(p.categoria);
      }
    });
    return [...set].sort();
  }, [ctx.productos, marca]);

  // Agrupar por categoría para mostrar
  const porCat = React.useMemo(() => groupBy(productos, "categoria"), [productos]);

  const copiarCodigo = (p) => {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(p.codigo).then(() => showToast(`📋 ${p.codigo} copiado`));
    } else { showToast(`Cód: ${p.codigo}`); }
  };

  return (
    <div className="space-y-4">
      <div className="bg-white border border-stone-200 rounded-lg p-4">
        <div className="flex items-baseline justify-between mb-3">
          <h2 className="display text-3xl">Catálogo</h2>
          <div className="text-sm text-stone-500">{productos.length} de {ctx.productos.length}</div>
        </div>
        <div className="space-y-2">
          <div className="relative">
            <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" />
            <input className="input pl-9" placeholder="Buscar código, nombre o categoría..." value={q} onChange={e => setQ(e.target.value)} autoFocus />
          </div>
          <div className="flex gap-1 bg-stone-100 p-1 rounded">
            {["TODOS", "FACCSA", "PROLONGO"].map(m => (
              <button key={m} onClick={() => { setMarca(m); setCat(""); }}
                className={"flex-1 py-1.5 text-xs font-bold rounded " + (marca === m ? "bg-white shadow-sm" : "text-stone-500")}>
                {m}
              </button>
            ))}
          </div>
          {categorias.length > 0 && (
            <select className="input" value={cat} onChange={e => setCat(e.target.value)}>
              <option value="">Todas las categorías ({categorias.length})</option>
              {categorias.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          )}
        </div>
        <div className="flex gap-3 text-xs mt-3">
          <div><span className="chip chip-fac">FACCSA</span> {ctx.productos.filter(p => p.marca === "FACCSA").length}</div>
          <div><span className="chip chip-pro">PROLONGO</span> {ctx.productos.filter(p => p.marca === "PROLONGO").length}</div>
        </div>
      </div>

      {productos.length === 0 ? (
        <div className="bg-white border border-stone-200 rounded-lg p-10 text-center text-stone-500">
          No hay productos con esos filtros.
        </div>
      ) : q.trim() ? (
        // Vista plana de búsqueda
        <div className="bg-white border border-stone-200 rounded-lg overflow-hidden">
          <div className="divide-y divide-stone-100">
            {productos.slice(0, 100).map(p => (
              <ProductoRow key={p.id} p={p} onCopy={copiarCodigo} />
            ))}
            {productos.length > 100 && (
              <div className="px-4 py-2 text-xs text-stone-500 text-center">+{productos.length - 100} más. Afina la búsqueda.</div>
            )}
          </div>
        </div>
      ) : (
        // Vista agrupada por categoría
        Object.keys(porCat).sort().map(c => (
          <div key={c} className="bg-white border border-stone-200 rounded-lg overflow-hidden">
            <div className="px-4 py-2 bg-stone-50 border-b border-stone-200 flex items-baseline justify-between">
              <div className="font-bold text-xs uppercase tracking-wider">{c || "SIN CATEGORÍA"}</div>
              <div className="text-xs text-stone-500">{porCat[c].length}</div>
            </div>
            <div className="divide-y divide-stone-100">
              {porCat[c].map(p => <ProductoRow key={p.id} p={p} onCopy={copiarCodigo} />)}
            </div>
          </div>
        ))
      )}
    </div>
  );
}

function ProductoRow({ p, onCopy }) {
  return (
    <button onClick={() => onCopy(p)} className="w-full text-left px-4 py-2 hover:bg-stone-50 flex items-center justify-between gap-3">
      <div className="min-w-0 flex-1">
        <div className="font-medium text-sm truncate">{p.descripcion}</div>
        <div className="text-xs text-stone-500 flex items-center gap-2 mt-0.5 flex-wrap">
          <span className={"chip " + (p.marca === "FACCSA" ? "chip-fac" : "chip-pro")}>{p.marca}</span>
          <span className="mono font-bold">{p.codigo}</span>
          {p.formato && <span>{p.formato}</span>}
          {p.categoria && <span className="text-stone-400">{p.categoria}</span>}
        </div>
      </div>
      <span className="text-stone-300 text-[10px]">copiar</span>
    </button>
  );
}

// ============================================
// VISTA: TARIFA (unificada con 3 sub-vistas)
// ============================================
function ViewTarifa({ ctx }) {
  const [sub, setSub] = React.useState("faccsa"); // faccsa | prolongo | promos

  // Aviso > 7 días para FACCSA
  const fechaFaccsa = ctx.tarifasMeta?.faccsa?.fecha;
  let diasFaccsa = null;
  if (fechaFaccsa) diasFaccsa = Math.floor((new Date() - new Date(fechaFaccsa)) / (1000*60*60*24));

  return (
    <div className="space-y-4">
      <div className="bg-white border border-stone-200 rounded-lg p-4">
        <div className="flex items-baseline justify-between mb-3">
          <h2 className="display text-3xl">Tarifa</h2>
        </div>
        <div className="flex gap-1 bg-stone-100 p-1 rounded">
          <button onClick={() => setSub("faccsa")} className={"flex-1 py-2 text-xs font-bold rounded relative " + (sub === "faccsa" ? "bg-white shadow-sm" : "text-stone-500")}>
            FACCSA
            {diasFaccsa > 7 && <span className="absolute top-1 right-1 w-2 h-2 rounded-full bg-red-600"></span>}
          </button>
          <button onClick={() => setSub("prolongo")} className={"flex-1 py-2 text-xs font-bold rounded " + (sub === "prolongo" ? "bg-white shadow-sm" : "text-stone-500")}>PROLONGO</button>
          <button onClick={() => setSub("promos")} className={"flex-1 py-2 text-xs font-bold rounded " + (sub === "promos" ? "bg-white shadow-sm" : "text-stone-500")}>PROMOCIONES</button>
        </div>
      </div>

      {sub === "faccsa" && <ViewTarifaFaccsa ctx={ctx} embedded={true} />}
      {sub === "prolongo" && <ViewTarifaProlongo ctx={ctx} embedded={true} />}
      {sub === "promos" && <ViewPromos ctx={ctx} embedded={true} />}
    </div>
  );
}

// ============================================
// VISTA: TARIFA FACCSA
// ============================================
function ViewTarifaFaccsa({ ctx, embedded }) {
  const [q, setQ] = React.useState("");
  const [tarifaSel, setTarifaSel] = React.useState("90");

  const productos = React.useMemo(() =>
    ctx.productos.filter(p => p.marca === 'FACCSA' && (p.precio_90 != null || p.precio_91 != null)),
    [ctx.productos]
  );
  const filtrados = React.useMemo(() => {
    if (!q.trim()) return productos;
    const Q = q.toUpperCase();
    return productos.filter(p =>
      p.descripcion.toUpperCase().includes(Q) ||
      p.codigo.includes(Q) ||
      (p.categoria || '').toUpperCase().includes(Q)
    );
  }, [productos, q]);

  // Aviso > 7 días
  const fecha = ctx.tarifasMeta?.faccsa?.fecha;
  let diasDesde = null;
  if (fecha) diasDesde = Math.floor((new Date() - new Date(fecha)) / (1000*60*60*24));

  return (
    <div className="space-y-4">
      <div className="bg-white border border-stone-200 rounded-lg p-4">
        {!embedded && (
          <div className="flex items-baseline justify-between mb-3">
            <h2 className="display text-3xl">Tarifa FACCSA</h2>
            <div className="text-sm text-stone-500">{filtrados.length} de {productos.length}</div>
          </div>
        )}
        {embedded && (
          <div className="text-sm text-stone-500 mb-2 text-right">{filtrados.length} de {productos.length}</div>
        )}
        <div className={"text-xs mb-3 p-2 rounded " + (diasDesde > 7 ? "bg-red-50 text-red-700 border border-red-200" : "text-stone-500")}>
          {diasDesde > 7 && <strong>⚠️ </strong>}
          Última actualización: <strong>{fecha || "—"}</strong>
          {diasDesde != null && <span> · hace {diasDesde} días</span>}
          {diasDesde > 7 && <span> · revisa nueva tarifa semanal</span>}
        </div>
        <div className="relative mb-2">
          <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" />
          <input className="input pl-9" placeholder="Buscar producto..." value={q} onChange={e => setQ(e.target.value)} />
        </div>
        <div className="flex gap-1 bg-stone-100 p-1 rounded">
          <button onClick={() => setTarifaSel("90")} className={"flex-1 py-1.5 text-xs font-bold rounded " + (tarifaSel === "90" ? "bg-white shadow-sm" : "text-stone-500")}>Tarifa 90</button>
          <button onClick={() => setTarifaSel("91")} className={"flex-1 py-1.5 text-xs font-bold rounded " + (tarifaSel === "91" ? "bg-white shadow-sm" : "text-stone-500")}>Tarifa 91</button>
        </div>
      </div>
      <TarifaList items={filtrados.map(p => ({
        codigo: p.codigo, descripcion: p.descripcion, categoria: p.categoria,
        precio: tarifaSel === "91" ? p.precio_91 : p.precio_90,
      }))} />
    </div>
  );
}

// ============================================
// VISTA: TARIFA PROLONGO
// ============================================
function ViewTarifaProlongo({ ctx }) {
  const [q, setQ] = React.useState("");
  const [colSel, setColSel] = React.useState("detall");

  const productos = React.useMemo(() =>
    ctx.productos.filter(p => p.marca === 'PROLONGO' && p.precio_detall != null),
    [ctx.productos]
  );
  const filtrados = React.useMemo(() => {
    if (!q.trim()) return productos;
    const Q = q.toUpperCase();
    return productos.filter(p =>
      p.descripcion.toUpperCase().includes(Q) ||
      p.codigo.includes(Q) ||
      (p.categoria || '').toUpperCase().includes(Q)
    );
  }, [productos, q]);

  const fecha = ctx.tarifasMeta?.prolongo?.fecha;

  return (
    <div className="space-y-4">
      <div className="bg-white border border-stone-200 rounded-lg p-4">
        <div className="flex items-baseline justify-between mb-3">
          <h2 className="display text-3xl">Tarifa Prolongo</h2>
          <div className="text-sm text-stone-500">{filtrados.length} de {productos.length}</div>
        </div>
        <div className="text-xs text-stone-500 mb-3">
          Última actualización: <strong>{fecha || "—"}</strong> · mensual
        </div>
        <div className="relative mb-2">
          <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" />
          <input className="input pl-9" placeholder="Buscar producto..." value={q} onChange={e => setQ(e.target.value)} />
        </div>
        <div className="flex gap-1 bg-stone-100 p-1 rounded">
          <button onClick={() => setColSel("detall")} className={"flex-1 py-1 text-xs font-bold rounded " + (colSel === "detall" ? "bg-white shadow-sm" : "text-stone-500")}>DETALL</button>
          <button onClick={() => setColSel("gms")} className={"flex-1 py-1 text-xs font-bold rounded " + (colSel === "gms" ? "bg-white shadow-sm" : "text-stone-500")}>GMS</button>
          <button onClick={() => setColSel("dist")} className={"flex-1 py-1 text-xs font-bold rounded " + (colSel === "dist" ? "bg-white shadow-sm" : "text-stone-500")}>DIST</button>
        </div>
      </div>
      <TarifaList items={filtrados.map(p => ({
        codigo: p.codigo, descripcion: p.descripcion, categoria: p.categoria,
        precio: colSel === "gms" ? p.precio_gms : colSel === "dist" ? p.precio_dist : p.precio_detall,
      }))} />
    </div>
  );
}

function TarifaList({ items }) {
  // Agrupar por categoría
  const porCat = React.useMemo(() => groupBy(items, "categoria"), [items]);
  if (items.length === 0) {
    return <div className="bg-white border border-stone-200 rounded-lg p-10 text-center text-stone-500">No hay productos.</div>;
  }
  return (
    <>
      {Object.keys(porCat).sort().map(c => (
        <div key={c} className="bg-white border border-stone-200 rounded-lg overflow-hidden">
          <div className="px-4 py-2 bg-stone-50 border-b border-stone-200 flex items-baseline justify-between">
            <div className="font-bold text-xs uppercase tracking-wider">{c || "SIN CATEGORÍA"}</div>
            <div className="text-xs text-stone-500">{porCat[c].length}</div>
          </div>
          <div className="divide-y divide-stone-100">
            {porCat[c].map(p => (
              <div key={p.codigo} className="px-4 py-2 flex items-center justify-between gap-3">
                <div className="min-w-0 flex-1">
                  <div className="font-medium text-sm truncate">{p.descripcion}</div>
                  <div className="text-xs text-stone-500 mono">{p.codigo}</div>
                </div>
                <div className="text-right shrink-0">
                  <div className="font-bold text-base mono">€{p.precio != null ? p.precio.toFixed(2) : "—"}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      ))}
    </>
  );
}

// ============================================
// VISTA: PROMOS
// ============================================
function ViewPromos({ ctx }) {
  const [q, setQ] = React.useState("");
  // Agrupar promos por cliente
  const porCliente = React.useMemo(() => {
    const map = {};
    ctx.promociones.items.forEach(p => {
      if (!map[p.cliente_cod]) map[p.cliente_cod] = [];
      map[p.cliente_cod].push(p);
    });
    return map;
  }, [ctx.promociones]);

  const clientesCods = Object.keys(porCliente).sort();
  const filtrados = q.trim() ? clientesCods.filter(cod => {
    const Q = q.toUpperCase();
    const cli = ctx.clientes.find(c => c.cod_faccsa === cod);
    return cod.includes(Q) || (cli && cli.nombre.toUpperCase().includes(Q));
  }) : clientesCods;

  return (
    <div className="space-y-4">
      <div className="bg-white border border-stone-200 rounded-lg p-4">
        <div className="flex items-baseline justify-between mb-3">
          <h2 className="display text-3xl">Promociones</h2>
          <div className="text-sm text-stone-500">{filtrados.length} de {clientesCods.length} clientes</div>
        </div>
        <div className="text-xs text-stone-500 mb-3">
          Semana <strong>{ctx.promociones.semana || "—"}</strong> · {ctx.promociones.items.length} líneas
        </div>
        <div className="relative">
          <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" />
          <input className="input pl-9" placeholder="Buscar por nombre o código cliente..." value={q} onChange={e => setQ(e.target.value)} />
        </div>
      </div>
      {filtrados.length === 0 ? (
        <div className="bg-white border border-stone-200 rounded-lg p-10 text-center text-stone-500">No hay promociones.</div>
      ) : (
        filtrados.map(cod => {
          const cli = ctx.clientes.find(c => c.cod_faccsa === cod);
          return (
            <div key={cod} className="bg-white border border-stone-200 rounded-lg overflow-hidden">
              <div className="px-4 py-2 bg-stone-50 border-b border-stone-200 flex items-baseline justify-between">
                <div>
                  <div className="font-bold text-sm">{cli ? cli.nombre : `Cliente ${cod}`}</div>
                  <div className="text-xs text-stone-500">{cli ? cli.poblacion : ""} · <span className="chip chip-fac">F·{cod}</span></div>
                </div>
                <div className="text-xs font-bold text-red-700">{porCliente[cod].length}</div>
              </div>
              <div className="divide-y divide-stone-100">
                {porCliente[cod].map((p, i) => (
                  <div key={i} className="px-4 py-2 flex items-center justify-between gap-3">
                    <div className="min-w-0 flex-1">
                      <div className="font-medium text-sm truncate">{p.descripcion}</div>
                      <div className="text-xs text-stone-500 mono">{p.producto_cod}</div>
                    </div>
                    <div className="font-bold text-base mono text-red-700 shrink-0">€{p.precio.toFixed(2)}</div>
                  </div>
                ))}
              </div>
            </div>
          );
        })
      )}
    </div>
  );
}

// ============================================
// VISTA: RUTAS
// ============================================
function ViewRutas({ ctx }) {
  const [expanded, setExpanded] = React.useState({});
  const porPob = groupBy(ctx.clientes, "poblacion");

  return (
    <div className="space-y-4">
      <div className="bg-white border border-stone-200 rounded-lg p-4">
        <div className="flex items-baseline justify-between">
          <h2 className="display text-3xl">Rutas</h2>
          <div className="text-sm text-stone-500">{Object.keys(porPob).length} poblaciones · {ctx.clientes.length} clientes</div>
        </div>
      </div>

      <div className="space-y-2">
        {Object.keys(porPob).sort().map(pob => {
          const cls = porPob[pob];
          const repartoDias = cls.find(c => c.dias_reparto)?.dias_reparto || "";
          const visitDia = cls[0]?.dia_visita;
          const q = cls.filter(c => c.frecuencia === "QUINCENAL").length;
          const m = cls.filter(c => c.frecuencia === "MENSUAL").length;
          const t = cls.filter(c => c.frecuencia === "TELEFONICA").length;
          const isOpen = expanded[pob];
          return (
            <div key={pob} className="bg-white border border-stone-200 rounded-lg overflow-hidden">
              <button onClick={() => setExpanded({ ...expanded, [pob]: !isOpen })}
                className="w-full px-4 py-3 flex items-center justify-between hover:bg-stone-50">
                <div className="text-left min-w-0 flex-1">
                  <div className="font-bold text-sm uppercase tracking-wider">{pob}</div>
                  <div className="text-xs text-stone-500 flex flex-wrap gap-2 mt-0.5">
                    <span>{cls.length} clientes</span>
                    {q > 0 && <span>· {q} quincenal</span>}
                    {m > 0 && <span>· {m} mensual</span>}
                    {t > 0 && <span>· {t} tel.</span>}
                    {repartoDias && <span>· 🚚 {repartoDias}</span>}
                    {visitDia && <span>· 📅 visita {DIAS_LABEL[visitDia]}</span>}
                  </div>
                </div>
                {isOpen ? <I name="chevron-down" size={16} className="text-stone-400" /> : <I name="chevron-right" size={16} className="text-stone-400" />}
              </button>
              {isOpen && (
                <div className="border-t border-stone-200 divide-y divide-stone-100">
                  {cls.map(c => <ClienteRow key={c.id} c={c} ctx={ctx} />)}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}
